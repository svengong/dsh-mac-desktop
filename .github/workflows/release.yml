name: Release

# 自动发布：推送 v* 标签时构建 macOS（arm64）、Windows（x64 + arm64）与
# Android（arm64）安装包，并发布 GitHub Release；也可手动触发
# （Actions → Release → Run workflow），此时必须填写要发布的 tag。
#
# 发布面刻意收窄：
#
#  - macOS 只出 arm64，且只出 dmg。macos-15 本身就是 arm64 runner，交叉构建
#    x64 只会多一个没人验证的产物；zip 与 dmg 是同一份 .app 的另一种封装，
#    发布页上并存只会让人犹豫装哪个。
#  - Windows 出 x64 与 arm64，但只出 NSIS setup。portable/zip 同理是同一份
#    载荷的另两种封装；setup 带升级与卸载，是唯一有安装语义的形态。
#  - Android 只出 arm64。应用是纯 Kotlin/Compose、没有 jniLibs，APK 天然与
#    ABI 无关；显式钉住 arm64 是为了让「只发 64 位」在配置里可见，而不是靠
#    「反正没有原生库」侥幸成立。
#  - Linux 不再发布。
#
# 一句话：每个平台只留「该架构的安装包」，不留 zip/portable 这类并列封装。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，如 v0.1.0（须与 package.json#version 一致）'
        required: false
        type: string
      draft:
        description: '创建为草稿（draft）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    # macOS：macos-15 是 arm64 runner，一次原生构建即可，不再交叉出 x64。
    # 不能用 macos-14：该镜像 2026-11-02 退役，brownout 期间 job 会在拿到
    # runner 前被直接取消（runner_id 0，0 个 step）。
    # Windows：直接用原生 runner，electron-builder 在那里打包 NSIS 最稳，
    # 且 win32-arm64 的 Electron 产物同样可在 x64 runner 上交叉构建。
    # Android：APK 与宿主架构无关，单跑一个 ubuntu runner 即可。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos
            arch: arm64
            flags: --mac dmg --arm64
          - os: windows-latest
            label: windows
            arch: x64
            flags: --win nsis --x64
          - os: windows-latest
            label: windows
            arch: arm64
            flags: --win nsis --arm64
          - os: ubuntu-24.04
            label: android
            arch: arm64
            # APK 是单个文件，不按架构命名：下面按固定的 app-release.apk 断言。
            flags: ''
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # 未签名构建，绝不误选钥匙串身份
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve and verify version
        id: version
        shell: bash
        run: |
          PKG="$(node -p "require('./package.json').version")"
          REF="${{ inputs.tag || github.ref_name }}"
          if [[ "${REF}" == v* ]]; then
            TAG="${REF#v}"
            if [ "${TAG}" != "${PKG}" ]; then
              echo "::error::Tag ${REF} does not match package.json version ${PKG}. Bump package.json first, then retag."
              exit 1
            fi
          fi
          echo "version=${PKG}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # smoke.js asserts a resolvable pnpm (tools.pnpm !== ''); the runner
      # has no user-level login shell, so without this the check fails.
      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Smoke tests
        run: npm run smoke

      # --publish never: electron-builder detects the v* tag and would try to
      # upload to GitHub itself; publishing is done by the publish job via
      # action-gh-release, and no GH_TOKEN is available here.
      # Call electron-builder directly with the matrix flags instead of an
      # npm script: the scripts are per-platform (dist:dmg is --mac only) and
      # would silently ignore a --win flag.
      - name: Package installers (macOS)
        if: matrix.label == 'macos'
        run: npx electron-builder ${{ matrix.flags }} --publish never

      # Windows MUST go through scripts/build-win.js, never electron-builder
      # directly. The wrapper pins ELECTRON_BUILDER_7Z_FILTER=BCJ: without it
      # the NSIS payload is packed with BCJ2, which the installer's own
      # extractor cannot decode and therefore SILENTLY SKIPS every PE file —
      # the app installs with no "DeepSeek Harness.exe" and no DLLs, while
      # still exiting 0. Reproduced on Windows 11 ARM64 (68 files/71.3MB/no exe
      # vs 75 files/287.7MB/6 dlls/exe). The wrapper also re-verifies the
      # payload method after building and fails the job if BCJ2 comes back.
      - name: Package installers (Windows, BCJ-pinned)
        if: matrix.label == 'windows'
        run: node scripts/build-win.js --${{ matrix.arch }} --publish never

      # Android is a Gradle build, not electron-builder. JDK 17 + the
      # platforms;android-35 / build-tools;35.0.0 packages are what
      # android/README.md requires; setup-java and setup-gradle cache the
      # wrapper distribution so the job does not re-download Gradle 8.9 every
      # release.
      #
      # GRADLE_USER_HOME is pointed into the checkout on purpose: the runner's
      # ~/.gradle is writable, but keeping it local makes this job behave the
      # same way as the documented sandboxed build in android/README.md.
      - name: Setup JDK
        if: matrix.label == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.label == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: true

      # android/.keystore/ is gitignored (it holds the AOSP debug key), so a
      # fresh checkout has none and the release type — which signs with it so
      # the APK is installable — would fail to build. Generate it here.
      # A RELEASED APK's identity is its signing certificate, and Android only
      # lets an update replace an installed app when the certificate MATCHES.
      # This step used to run `keytool -genkeypair` on every build, minting a
      # brand-new key each time: same DN (CN=Android Debug), different keypair,
      # therefore a different certificate — so every release was uninstallable
      # OVER the previous one:
      #   INSTALL_FAILED_UPDATE_INCOMPATIBLE: signatures do not match
      # Measured across v0.10.11 / v0.10.13 / v0.10.14: three different SHA-256
      # digests. The key now comes from a repository secret and is reused for
      # every build, so upgrades work from here on. (Releases published BEFORE
      # this change are unrecoverable: their keys were never saved.)
      - name: Restore signing keystore
        if: matrix.label == 'android'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          : "${STOREPASS:=android}"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set."
            echo "A release must be signed with the SAME keystore as the previous one,"
            echo "otherwise it cannot be installed over it. Create it once (scripts/android-keystore.sh)"
            echo "and store it as a repository secret; see android/README.md."
            exit 1
          fi
          mkdir -p .keystore
          printf '%s' "$KEYSTORE_B64" | base64 --decode > .keystore/debug.keystore
          test -s .keystore/debug.keystore || { echo "::error::decoded keystore is empty"; exit 1; }
          # The alias is NOT assumed: the key created by scripts/android-keystore.sh
          # is named `dsh-release`, while the local convenience key is
          # `androiddebugkey`. Checking for one specific name failed a valid key.
          # Accept any private-key entry and pass the alias through to Gradle.
          ALIAS="$(keytool -list -keystore .keystore/debug.keystore -storepass "$STOREPASS" 2>/dev/null \
            | sed -n 's/^\([^,]*\),.*PrivateKeyEntry.*/\1/p' | head -1)"
          test -n "$ALIAS" || { echo "::error::keystore has no PrivateKeyEntry"; exit 1; }
          # BOTH values must reach the Gradle step: build.gradle.kts reads the
          # alias and password from the environment, and a step-local `env:`
          # does not outlive its own `run`. Forgetting the password failed the
          # build with "keystore password was incorrect" while everything above
          # had succeeded, which is a confusing place to land.
          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STOREPASS" >> "$GITHUB_ENV"
          echo "keystore restored (alias: $ALIAS)"

      - name: Package APK (Android, arm64)
        if: matrix.label == 'android'
        working-directory: android
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/android/.gradle-home
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon
          # Name the artifact after the version so the release page shows it.
          # release is signed with the checked-in debug key (see
          # app/build.gradle.kts), so the output is app-release.apk rather than
          # an unsigned APK nobody could install.
          VERSION="$(node -p "require('../package.json').version")"
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)"
          fi
          test -n "$APK" && test -f "$APK" || { echo "::error::no APK produced"; ls -R app/build/outputs 2>/dev/null; exit 1; }
          case "$APK" in
            *unsigned*) echo "::error::APK is unsigned and cannot be installed: $APK"; exit 1 ;;
          esac
          mkdir -p ../dist
          cp "$APK" "../dist/dsh-android-${VERSION}-arm64.apk"
          echo "apk: dist/dsh-android-${VERSION}-arm64.apk"

      # Assert the exact file names instead of trusting the build config: a
      # silent target drop (an electron-builder default changing, a Gradle task
      # renaming its output) otherwise ships a release page missing a platform.
      - name: Assert release artifacts
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case '${{ matrix.label }}' in
            macos)
              f="dsh-mac-desktop-${VERSION}-macos-arm64.dmg"
              test -f "dist/$f" || { echo "::error::missing $f"; ls -1 dist; exit 1; }
              ;;
            windows)
              # setup ONLY — portable/zip are not published for any platform.
              f="dsh-desktop-${VERSION}-windows-${{ matrix.arch }}-setup.exe"
              test -f "dist/$f" || { echo "::error::missing $f"; ls -1 dist; exit 1; }
              ;;
            android)
              f="dsh-android-${VERSION}-arm64.apk"
              test -f "dist/$f" || { echo "::error::missing $f"; ls -1 dist; exit 1; }
              # The FILENAME carries the version; so must the package inside it.
              # These drifted apart: versionName was a hardcoded "0.1.0" while the
              # release page said 0.10.13, so every install reported the wrong
              # version in Settings and two builds were indistinguishable.
              AAPT="$(ls -1 "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
              test -n "$AAPT" || AAPT="$(command -v aapt2 || true)"
              test -n "$AAPT" || { echo "::error::aapt2 not found; cannot verify the APK version"; exit 1; }
              badging="$("$AAPT" dump badging "dist/$f" 2>/dev/null | head -1)"
              got="$(printf '%s' "$badging" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")"
              code="$(printf '%s' "$badging" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")"
              if [ "$got" != "$VERSION" ]; then
                echo "::error::APK versionName is '$got' but the release is $VERSION"
                echo "  android/app/build.gradle.kts must read package.json, not hardcode a version"
                exit 1
              fi
              case "$code" in
                ''|0) echo "::error::APK versionCode is '$code'; it must be derived from versionName"; exit 1 ;;
              esac
              echo "apk version ok: $got ($code)"

              # The certificate must be the SAME one every release is signed with.
              # A rotated key makes the APK impossible to install over the
              # previous one, and nothing else in the pipeline would notice.
              expected="${{ vars.ANDROID_SIGNING_SHA256 }}"
              APKSIGNER="$(ls -1 "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
              test -n "$APKSIGNER" || APKSIGNER="$(command -v apksigner || true)"
              test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
              actual="$("$APKSIGNER" verify --print-certs "dist/$f" 2>/dev/null \
                | sed -n "s/.*SHA-256 digest: //p" | head -1 | tr 'A-F' 'a-f')"
              test -n "$actual" || { echo "::error::could not read the APK signing certificate"; exit 1; }
              if [ -n "$expected" ]; then
                expected="$(printf '%s' "$expected" | tr -d ':' | tr 'A-F' 'a-f')"
                if [ "$actual" != "$expected" ]; then
                  echo "::error::APK is signed by $actual but the pinned key is $expected"
                  echo "  updates would fail with INSTALL_FAILED_UPDATE_INCOMPATIBLE"
                  exit 1
                fi
                echo "apk signature ok: $actual"
              else
                echo "::warning::ANDROID_SIGNING_SHA256 is unset; cannot pin the signing certificate."
                echo "  Set it to: $actual"
              fi
              ;;
          esac
          echo "artifacts ok (${{ matrix.label }} ${{ matrix.arch }})"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.label }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.apk
            dist/latest-*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.ref }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          # fail_on_unmatched_files is the REAL input name (fail_on_unmatched_globs
          # does not exist and Actions only warns about unknown inputs, so the
          # gate silently never ran).
          fail_on_unmatched_files: true
          files: release-assets/*

