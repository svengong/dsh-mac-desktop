name: Release

# 自动发布：推送 v* 标签时构建 macOS（arm64/x64）、Windows（x64/arm64）与
# Linux（x64/arm64）安装包，并发布 GitHub Release；也可手动触发
# （Actions → Release → Run workflow），此时必须填写要发布的 tag。
#
# 平台矩阵刻意分开跑：macOS 用 electron-builder 的 dmg/zip 目标，Windows 用
# nsis/portable/zip，Linux 用 AppImage/deb。三个平台都必须产出 arm64 与 x64 ——
# Windows on ARM 已进入正式支持（Snapdragon X 系列），Electron 也从 33 起提供
# win32-arm64 产物；Linux arm64 同样是一方支持目标。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，如 v0.1.0（须与 package.json#version 一致）'
        required: false
        type: string
      draft:
        description: '创建为草稿（draft）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    # 单台 arm64 macOS runner 交叉构建两种 macOS 架构（macos-13/x64 已退役，勿用）。
    # Windows 直接用原生 runner：electron-builder 在那里打包 nsis/portable 最稳，
    # 且 win32-arm64 的 Electron 产物同样可在 x64 runner 上交叉构建。
    #
    # Linux 不能用交叉构建的省事路径：deb 走 fpm，arm64 需要 aarch64 的
    # 打包工具链，x64 runner 上装不出来；AppImage 还要下载对应架构的
    # appimage 运行库。所以这里用原生架构 runner（ubuntu-24.04-arm 是
    # GitHub 官方 arm64 runner），各打各的架构。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos
            arch: arm64
            flags: --mac dmg zip --arm64
          - os: macos-14
            label: macos
            arch: x64
            flags: --mac dmg zip --x64
          - os: windows-latest
            label: windows
            arch: x64
            flags: --win nsis portable zip --x64
          - os: windows-latest
            label: windows
            arch: arm64
            flags: --win nsis portable zip --arm64
          - os: ubuntu-24.04
            label: linux
            arch: x64
            flags: --linux AppImage deb --x64
          - os: ubuntu-24.04-arm
            label: linux
            arch: arm64
            flags: --linux AppImage deb --arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # 未签名构建，绝不误选钥匙串身份
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve and verify version
        id: version
        shell: bash
        run: |
          PKG="$(node -p "require('./package.json').version")"
          REF="${{ inputs.tag || github.ref_name }}"
          if [[ "${REF}" == v* ]]; then
            TAG="${REF#v}"
            if [ "${TAG}" != "${PKG}" ]; then
              echo "::error::Tag ${REF} does not match package.json version ${PKG}. Bump package.json first, then retag."
              exit 1
            fi
          fi
          echo "version=${PKG}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # smoke.js asserts a resolvable pnpm (tools.pnpm !== ''); the runner
      # has no user-level login shell, so without this the check fails.
      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Smoke tests
        run: npm run smoke

      # --publish never: electron-builder detects the v* tag and would try to
      # upload to GitHub itself; publishing is done by the publish job via
      # action-gh-release, and no GH_TOKEN is available here.
      # Call electron-builder directly with the matrix flags instead of an
      # npm script: the scripts are per-platform (dist:dmg is --mac only) and
      # would silently ignore a --win flag.
      - name: Package installers (macOS)
        if: matrix.label == 'macos'
        run: npx electron-builder ${{ matrix.flags }} --publish never

      # Windows MUST go through scripts/build-win.js, never electron-builder
      # directly. The wrapper pins ELECTRON_BUILDER_7Z_FILTER=BCJ: without it
      # the NSIS payload is packed with BCJ2, which the installer's own
      # extractor cannot decode and therefore SILENTLY SKIPS every PE file —
      # the app installs with no "DeepSeek Harness.exe" and no DLLs, while
      # still exiting 0. Reproduced on Windows 11 ARM64 (68 files/71.3MB/no exe
      # vs 75 files/287.7MB/6 dlls/exe). The wrapper also re-verifies the
      # payload method after building and fails the job if BCJ2 comes back.
      - name: Package installers (Windows, BCJ-pinned)
        if: matrix.label == 'windows'
        run: node scripts/build-win.js --${{ matrix.arch }} --publish never

      # Linux shares electron-builder with macOS, so it can be called directly
      # (unlike Windows, which needs the BCJ pin). The deb target hard-fails
      # without homepage + author in package.json — both are present.
      - name: Package installers (Linux)
        if: matrix.label == 'linux'
        run: npx electron-builder ${{ matrix.flags }} --publish never

      # ${arch} expands per format on Linux (x86_64 for AppImage, amd64 for
      # deb), so assert the real names here instead of trusting the config.
      - name: Assert Linux artifact names
        if: matrix.label == 'linux'
        shell: bash
        run: |
          case '${{ matrix.arch }}' in
            x64)   ARCH_APPIMAGE=x86_64; ARCH_DEB=amd64 ;;
            arm64) ARCH_APPIMAGE=arm64;  ARCH_DEB=arm64 ;;
          esac
          VERSION="$(node -p "require('./package.json').version")"
          for f in "dsh-desktop-${VERSION}-linux-${ARCH_APPIMAGE}.AppImage" \
                   "dsh-desktop-${VERSION}-linux-${ARCH_DEB}.deb"; do
            test -f "dist/$f" || { echo "::error::missing $f"; ls -1 dist; exit 1; }
          done
          echo "linux artifacts ok (${{ matrix.arch }})"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.label }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest-*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.ref }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          # fail_on_unmatched_files is the REAL input name (fail_on_unmatched_globs
          # does not exist and Actions only warns about unknown inputs, so the
          # gate silently never ran).
          fail_on_unmatched_files: true
          files: release-assets/*

