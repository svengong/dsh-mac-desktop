name: CI

# 日常检查：PR 与 main 分支推送时跑冒烟测试 + 打包预检，防止合并前破坏打包链路。
# macOS（dmg）、Windows（NSIS setup，x64 + arm64）、Android（APK）各跑一遍：
# 三条打包链路完全不同（electron-builder dmg、BCJ 钉住的 NSIS、Gradle），
# 只在一条上验证会让另外两条静默腐化。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # smoke.js asserts a resolvable pnpm (tools.pnpm !== ''); the runner
      # has no user-level login shell, so without this the check fails.
      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Smoke tests
        run: npm run smoke

  package:
    name: Package check (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: arm64 only. The release surface no longer ships x64, so CI
          # must not spend a job proving a target nobody downloads.
          - os: macos-14
            label: macos
            arch: arm64
            bundle: dist/mac-arm64/DeepSeek Harness.app
          # Windows ships x64 AND arm64 as NSIS setup, so CI proves both. This
          # job is also the guard that catches the BCJ2 payload bug; checking
          # only one arch would leave the other installer unverified while
          # still publishing it.
          - os: windows-latest
            label: windows
            arch: arm64
            bundle: dist/win-arm64-unpacked/DeepSeek Harness.exe
          - os: windows-latest
            label: windows
            arch: x64
            bundle: dist/win-unpacked/DeepSeek Harness.exe
          # Android ships a single arm64 APK. Gradle compiles offline, so it
          # runs on a plain ubuntu runner.
          - os: ubuntu-24.04
            label: android
            arch: arm64
            bundle: android/app/build/outputs/apk/release/app-release.apk
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --publish never: a v* tag on HEAD makes electron-builder try to
      # upload to GitHub; CI has no GH_TOKEN and only checks the build.
      #
      # Build the real DMG, not just `--mac dir`: the preflight exists to catch
      # a broken packaging chain, and `dir` skips the dmg-builder step entirely,
      # so a dmg-only regression (renamed target, missing artifactName override)
      # would sail through and only surface on the release page. `dir` is listed
      # too, because the bundle assertion below checks the .app.
      - name: Build installer (macOS, dmg)
        if: matrix.label == 'macos'
        run: npx electron-builder --mac dir dmg --arm64 --publish never

      # Windows goes through scripts/build-win.js, which pins
      # ELECTRON_BUILDER_7Z_FILTER=BCJ. Calling electron-builder directly packs
      # the NSIS payload with BCJ2, and the installer's extractor then SILENTLY
      # SKIPS every PE file — the app installs with no main .exe and no DLLs
      # but still exits 0. This job is the guard that would have caught it.
      - name: Build app bundle (Windows, BCJ-pinned)
        if: matrix.label == 'windows'
        run: node scripts/build-win.js --${{ matrix.arch }} --publish never

      # Android: Gradle, not electron-builder. The release APK is signed with
      # the checked-in debug key (see android/app/build.gradle.kts) so the
      # artifact is installable; an unsigned APK would build "fine" and then be
      # unusable on a device.
      - name: Setup JDK (Android)
        if: matrix.label == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # sdkmanager is invoked explicitly instead of relying on the action's
      # default package set: the failure mode otherwise is a red "Setup Android
      # SDK" step with no useful log, because the action only prepares
      # cmdline-tools and defers the real install to Gradle.
      - name: Setup Android SDK
        if: matrix.label == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: true

      - name: Install Android SDK packages
        if: matrix.label == 'android'
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build APK (Android, arm64)
        if: matrix.label == 'android'
        working-directory: android
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/android/.gradle-home
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Assert artifact naming and bundle
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -e "${{ matrix.bundle }}" || { echo "::error::missing ${{ matrix.bundle }}"; exit 1; }
          echo "bundle ok for v${VERSION} (${{ matrix.label }})"
          ls -1 dist 2>/dev/null | sed 's/^/  /' || true

      # Guard the shipped file names explicitly. A silent target drop (an
      # electron-builder default changing, a Gradle task renaming its output)
      # would otherwise publish a release page missing a platform.
      - name: Assert installer names
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case '${{ matrix.label }}' in
            windows)
              # setup ONLY: portable/zip are not published for any platform.
              f="dist/dsh-desktop-${VERSION}-windows-${{ matrix.arch }}-setup.exe"
              test -f "$f" || { echo "::error::missing $f"; ls -1 dist; exit 1; }
              ;;
            macos)
              # dmg ONLY: zip is no longer published for any platform.
              f="dist/dsh-mac-desktop-${VERSION}-macos-arm64.dmg"
              test -f "$f" || { echo "::error::missing $f"; ls -1 dist; exit 1; }
              ;;
            android)
              apk="android/app/build/outputs/apk/release/app-release.apk"
              test -f "$apk" || { echo "::error::missing $apk"; exit 1; }
              case "$apk" in *unsigned*) exit 1 ;; esac
              ;;
          esac
          echo "installer names ok (${{ matrix.label }} ${{ matrix.arch }})"
