name: CI

# 日常检查：PR 与 main 分支推送时跑冒烟测试 + 打包预检，防止合并前破坏打包链路。
# macOS、Windows、Linux 各跑一遍：三条打包链路完全不同（dmg/zip、nsis/portable、
# AppImage/deb），只在一条上验证会让另外两条静默腐化。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # smoke.js asserts a resolvable pnpm (tools.pnpm !== ''); the runner
      # has no user-level login shell, so without this the check fails.
      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Smoke tests
        run: npm run smoke

  package:
    name: Package check (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-build both macOS architectures from one arm64 runner
          # (macos-13/x64 is retired — do not use it).
          - os: macos-14
            label: macos
            arch: arm64
            bundle: dist/mac-arm64/DeepSeek Harness.app
          # Windows ships x64 AND arm64; the NSIS/portable targets are
          # architecture-agnostic, so one job with an explicit --x64 --arm64
          # pair proves both.
          - os: windows-latest
            label: windows
            arch: arm64
            bundle: dist/win-arm64-unpacked/DeepSeek Harness.exe
          # Linux ships AppImage AND deb, which share one packaging chain but
          # NOT one arch spelling: ${arch} expands to x86_64 for AppImage and
          # amd64 for deb (arm64 is arm64 in both). The assertion below checks
          # the real filenames, so a rename regression fails the job instead of
          # shipping mislabelled artifacts.
          - os: ubuntu-24.04
            label: linux
            arch: x64
            # x64 has no arch suffix, so the unpacked dir is plain linux-unpacked.
            # The binary name comes from build.linux.executableName (NOT the
            # package name or productName) — verified against a real build.
            bundle: dist/linux-unpacked/deepseek-harness
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --publish never: a v* tag on HEAD makes electron-builder try to
      # upload to GitHub; CI has no GH_TOKEN and only checks the build.
      - name: Build app bundle (macOS)
        if: matrix.label == 'macos'
        run: npm run dist -- --mac dir --publish never

      # Windows goes through scripts/build-win.js, which pins
      # ELECTRON_BUILDER_7Z_FILTER=BCJ. Calling electron-builder directly packs
      # the NSIS payload with BCJ2, and the installer's extractor then SILENTLY
      # SKIPS every PE file — the app installs with no main .exe and no DLLs
      # but still exits 0. This job is the guard that would have caught it.
      - name: Build app bundle (Windows, BCJ-pinned)
        if: matrix.label == 'windows'
        run: node scripts/build-win.js --${{ matrix.arch }} --publish never

      # Linux uses the same electron-builder chain as macOS/Windows, but the
      # deb target additionally requires homepage + author (electron-builder
      # hard-fails without them) — that is why package.json carries both.
      # --publish never for the same reason as the other two jobs.
      - name: Build installers (Linux)
        if: matrix.label == 'linux'
        run: npm run dist:linux:${{ matrix.arch }} -- --publish never

      - name: Assert artifact naming and bundle
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -e "${{ matrix.bundle }}"
          echo "bundle ok for v${VERSION} (${{ matrix.label }})"
          ls -1 dist | sed 's/^/  /'

      # Guard the Linux artifact names explicitly: ${arch} expands per format
      # (x86_64 for AppImage, amd64 for deb), so a casual rename would produce
      # mislabelled downloads that still "build fine".
      - name: Assert Linux artifact names
        if: matrix.label == 'linux'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -f "dist/dsh-desktop-${VERSION}-linux-x86_64.AppImage" \
            || { echo "::error::AppImage missing or misnamed"; ls -1 dist; exit 1; }
          test -f "dist/dsh-desktop-${VERSION}-linux-amd64.deb" \
            || { echo "::error::deb missing or misnamed"; ls -1 dist; exit 1; }
          echo "linux artifact names ok"
