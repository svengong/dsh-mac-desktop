name: CI

# 日常检查：PR 与 main 分支推送时跑冒烟测试 + 打包预检，防止合并前破坏打包链路。
# macOS 与 Windows 各跑一遍：两条打包链路完全不同（dmg/zip vs nsis/portable），
# 只在一条上验证会让另一条静默腐化。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # smoke.js asserts a resolvable pnpm (tools.pnpm !== ''); the runner
      # has no user-level login shell, so without this the check fails.
      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Smoke tests
        run: npm run smoke

  package:
    name: Package check (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-build both macOS architectures from one arm64 runner
          # (macos-13/x64 is retired — do not use it).
          - os: macos-14
            label: macos
            arch: arm64
            bundle: dist/mac-arm64/DeepSeek Harness.app
          # Windows ships x64 AND arm64; the NSIS/portable targets are
          # architecture-agnostic, so one job with an explicit --x64 --arm64
          # pair proves both.
          - os: windows-latest
            label: windows
            arch: arm64
            bundle: dist/win-arm64-unpacked/DeepSeek Harness.exe
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --publish never: a v* tag on HEAD makes electron-builder try to
      # upload to GitHub; CI has no GH_TOKEN and only checks the build.
      - name: Build app bundle (macOS)
        if: matrix.label == 'macos'
        run: npm run dist -- --mac dir --publish never

      # Windows goes through scripts/build-win.js, which pins
      # ELECTRON_BUILDER_7Z_FILTER=BCJ. Calling electron-builder directly packs
      # the NSIS payload with BCJ2, and the installer's extractor then SILENTLY
      # SKIPS every PE file — the app installs with no main .exe and no DLLs
      # but still exits 0. This job is the guard that would have caught it.
      - name: Build app bundle (Windows, BCJ-pinned)
        if: matrix.label == 'windows'
        run: node scripts/build-win.js --${{ matrix.arch }} --publish never

      - name: Assert artifact naming and bundle
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -e "${{ matrix.bundle }}"
          echo "bundle ok for v${VERSION} (${{ matrix.label }})"
          ls -1 dist | sed 's/^/  /'
