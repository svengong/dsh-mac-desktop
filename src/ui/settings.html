<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH — 设置</title>
<script>
  // Boot the panel's theme before first paint (no flash). The main process
  // injects `theme` as a query param; runtime changes arrive via onTheme.
  (function () {
    var t = new URLSearchParams(location.search).get('theme')
    if (t) document.documentElement.dataset.theme = t
  })()
</script>
<link rel="stylesheet" href="./shell.css">
<style>
  body { width: 100%; height: 100vh; }
  .section-lead { margin: 2px 0 12px; color: var(--ds-text-muted); font-size: 12.5px; }
  #update-components .component { margin-bottom: 0; }
  .page-block-head {
    margin: 0 0 var(--ds-space-2);
    font-size: var(--ds-font-size-lg);
    font-weight: var(--ds-font-weight-semibold);
  }
  .settings-section + .settings-section { margin-top: 26px; }
  /* Single scrolling page: keep the reading width bounded on wide windows. */
  .settings-scroll > .settings-section { max-width: 780px; }
  /* All settings text is copyable: the shell disables selection globally,
     but a settings page is reference material users quote from. */
  .settings-main { user-select: text; -webkit-user-select: text; }
</style>
</head>
<body>
<div class="settings-shell">
  <main class="settings-main">
    <header class="settings-titlebar">
      <div class="settings-title-group">
        <h1>设置</h1>
      </div>
      <span class="badge info titlebar-terminal" id="titlebar-terminal">DSH-[本地]</span>
      <div class="titlebar-actions">
        <button id="close-window" class="button quiet small" type="button" aria-label="关闭设置">关闭</button>
      </div>
    </header>

    <div class="settings-scroll">
      <section id="section-updates" class="settings-section">
        <div class="page-block-head">更新</div>
        <p class="section-lead" id="updates-lead">检查与更新当前设备的 Harness。</p>
        <div class="top-actions">
          <button id="check-all" class="button" type="button">检查更新</button>
          <button id="update-all" class="button primary" type="button">更新 Harness 并重启</button>
          <button id="cancel-update" class="button danger" type="button" hidden>取消更新</button>
          <button id="restart-service" class="button" type="button">重启服务</button>
          <span style="flex:1"></span>
          <label class="switch-row">
            <span style="color:var(--ds-text-muted);font-size:12px">启动自动检查</span>
            <button id="auto-check" class="switch" type="button" role="switch" aria-label="启动自动检查"></button>
          </label>
        </div>

        <div class="component-list" id="update-components" style="margin-bottom:12px" aria-live="polite"></div>
      </section>

      <section id="section-connection" class="settings-section">
        <div class="page-block-head">连接</div>
        <p class="section-lead">本地模式直接使用本机仓库；SSH 远程模式参考 VS Code Remote。保存后自动连接并进入界面。</p>
        <div id="live-strip" class="live-strip ok" hidden></div>

        <div class="card">
          <div class="card-head">
            <h2 class="card-title">连接方式</h2>
            <div class="segmented" id="mode-switch" role="tablist" aria-label="连接方式">
              <button type="button" data-mode="local" class="active" role="tab" aria-selected="true">本地</button>
              <button type="button" data-mode="ssh" role="tab" aria-selected="false">SSH 远程</button>
            </div>
          </div>
          <div class="card-body">
            <section id="local-fields">
              <div class="field">
                <label class="field-label" for="local-repo">仓库目录 <small>（默认：产品目录下的 deepseek-harness/）</small></label>
                <div class="picker">
                  <input id="local-repo" class="input" type="text" placeholder="deepseek-harness">
                  <button id="pick-local" class="button" type="button">选择…</button>
                </div>
                <p class="field-hint">目录不存在时，将按下方「仓库地址」自动克隆。</p>
              </div>
              <div class="field">
                <label class="field-label" for="local-url">仓库地址 <small>（可选）</small></label>
                <input id="local-url" class="input" type="text" placeholder="https://github.com/deepseek-ai/deepseek-harness.git">
              </div>
              <div class="field">
                <label class="field-label" for="local-home">数据目录 <small>（dsh home，会话与运行数据）</small></label>
                <input id="local-home" class="input" type="text" value="~/.dsh-dev">
              </div>
            </section>

            <section id="ssh-fields" class="hidden">
              <div class="field">
                <label class="field-label" for="ssh-host">SSH 主机 <small>（~/.ssh/config 别名或 user@host[:port]）</small></label>
                <div class="picker">
                  <select id="ssh-host" class="select"></select>
                  <button id="test-ssh" class="button" type="button">测试连接</button>
                </div>
              </div>
              <div class="field" id="ssh-custom-row" hidden>
                <label class="field-label" for="ssh-custom">自定义地址</label>
                <input id="ssh-custom" class="input" type="text" placeholder="dev@10.0.0.8">
              </div>
              <p class="field-hint" id="ssh-host-detail"></p>
              <p class="field-hint" id="ssh-test-result"></p>
              <div class="row-grid">
                <div class="field"><label class="field-label" for="ssh-url">远程仓库地址 <small>（可选）</small></label><input id="ssh-url" class="input" type="text" placeholder="https://github.com/deepseek-ai/deepseek-harness.git"></div>
                <div class="field"><label class="field-label" for="ssh-dir">远程仓库目录</label><input id="ssh-dir" class="input" type="text" value="~/deepseek-harness"></div>
              </div>
            </section>

            <div class="panel-actions">
              <button type="button" class="button primary save-card" id="save-settings">保存并连接</button>
            </div>
          </div>
        </div>
      </section>

      <section id="section-appearance" class="settings-section">
        <div class="page-block-head">外观</div>
        <div class="appearance-block">
          <div class="theme-grid" id="theme-grid" role="radiogroup" aria-label="外观主题"></div>
        </div>
      </section>

      <section id="section-log" class="settings-section">
        <div class="page-block-head">日志</div>
        <div class="log-wrap updates-log" id="update-log-wrap">
          <div class="log-tools">
            <span class="log-label">操作日志</span>
            <span>
              <button id="copy-log" class="button quiet small" type="button">复制</button>
              <button id="reveal-log" class="button quiet small" type="button">打开日志文件</button>
            </span>
          </div>
          <pre class="log" id="log">等待操作…</pre>
        </div>
      </section>

    </div>

    <footer class="settings-footer">
      <span class="footer-note" id="footer-note">已载入当前设置</span>
      <span class="footer-actions" id="footer-actions"></span>
    </footer>
  </main>
</div>

<script>
'use strict'
const $ = id => document.getElementById(id)
const api = window.desktopDialog

const params = new URLSearchParams(location.search)
const embedded = params.get('embedded') === '1'
if (embedded) document.body.classList.add('embedded')
let sshHostEntries = []
let activeMode = 'local'
let updateState = { busy: false, updating: false, autoCheckOnLaunch: true, lastCheckAt: '', components: [], available: [] }
// One-shot guard for the cancel button click state. Set while a cancel
// request is in flight; renderUpdates() resets it once the update settles.
let cancelClickPending = false
let deviceTerminal = '本地'
let savedSettings = null
let activeTheme = 'default'

function status(text, ok) {
  const el = $('footer-note')
  el.textContent = text
  el.style.color = ok === false ? 'var(--ds-warning)' : 'var(--ds-text-muted)'
}
function switchOf(id) { return $(id).getAttribute('aria-checked') === 'true' }
function setSwitch(id, value) { $(id).setAttribute('aria-checked', value ? 'true' : 'false') }

// ── single-page layout ─────────────────────────────────────────────────────
// The settings panel is ONE scrolling page (更新 → 连接 → 外观 → 日志).
// `dialog:section` from the main process (launcher / menus / error buttons)
// only scrolls to the matching anchor.

function anchorSection(section) {
  const target = section === 'updates' ? $('section-updates') : $('section-connection')
  if (target !== null) target.scrollIntoView({ behavior: 'smooth', block: 'start' })
}

$('close-window').addEventListener('click', () => {
  if (api.closePanel) api.closePanel()
  else window.close()
})
api.onSection && api.onSection(section => anchorSection(section))

function renderFooter() {
  // Footer only shows the live status note; the primary save action lives
  // inline at the bottom of the connection card (right where the form is),
  // so the footer stops being a misplaced global action.
  $('footer-actions').textContent = ''
}

// Wire the connection card's primary save button once.
$('save-settings').addEventListener('click', saveSettings)

// ── connection form ─────────────────────────────────────────────────────────

function currentMode() { return document.querySelector('#mode-switch .active').dataset.mode }
function refreshMode() {
  const ssh = currentMode() === 'ssh'
  $('local-fields').classList.toggle('hidden', ssh)
  $('ssh-fields').classList.toggle('hidden', !ssh)
  for (const button of document.querySelectorAll('#mode-switch button')) {
    button.classList.toggle('active', button.dataset.mode === currentMode())
    button.setAttribute('aria-selected', button.dataset.mode === currentMode() ? 'true' : 'false')
  }
}
document.querySelectorAll('#mode-switch button').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('#mode-switch button').forEach(other => other.classList.toggle('active', other === button))
    activeMode = button.dataset.mode === 'ssh' ? 'ssh' : 'local'
    refreshMode()
  })
})
function selectedSshHost() { return $('ssh-host').value === '__custom__' ? $('ssh-custom').value.trim() : $('ssh-host').value }
function refreshSshHost() {
  const custom = $('ssh-host').value === '__custom__'
  $('ssh-custom-row').hidden = !custom
  const entry = sshHostEntries.find(item => item.alias === $('ssh-host').value)
  $('ssh-host-detail').textContent = entry ? `→ ${entry.detail}` : custom ? '→ 直连，不经 ~/.ssh/config' : ''
}
$('pick-local').addEventListener('click', async () => { const dir = await api.pickDirectory(); if (dir) $('local-repo').value = dir })
$('ssh-host').addEventListener('change', refreshSshHost)
$('ssh-custom').addEventListener('input', refreshSshHost)
$('test-ssh').addEventListener('click', async () => {
  const result = $('ssh-test-result')
  const target = selectedSshHost()
  result.className = 'field-hint'
  if (target === '') { result.textContent = '请先选择 SSH 主机'; result.style.color = 'var(--ds-danger)'; return }
  result.textContent = '测试中…'; result.style.color = 'var(--ds-text-muted)'
  const outcome = await api.testSsh(target)
  result.textContent = outcome.ok ? '连接成功' : `失败：${outcome.message}`
  result.style.color = outcome.ok ? 'var(--ds-success)' : 'var(--ds-danger)'
})

// ── settings runtime ────────────────────────────────────────────────────────

const KIND_TEXT = { harness: 'Harness' }
function runtimeDot(row) {
  const state = row.updateAvailable ? 'available' : row.status
  const busy = row.status === 'checking' || row.status === 'updating'
  const span = document.createElement('span'); span.className = `status-dot${busy ? ' pulse' : ''}`
  span.dataset.status = state; span.setAttribute('aria-hidden', 'true'); return span
}
function badge(text, cls) { const span = document.createElement('span'); span.className = `badge ${cls || ''}`; span.textContent = text; return span }
function runtimeMeta(row) {
  const parts = []
  if (row.current) parts.push(`当前 ${row.current}`)
  if (row.latest && row.latest !== row.current) parts.push(`最新 ${row.latest}`)
  return parts.join('  ·  ')
}
function renderUpdates() {
  const list = $('update-components'); list.textContent = ''
  if (updateState.detached) {
    const empty = document.createElement('div')
    empty.className = 'component empty-state'
    empty.style.cssText = 'display:flex;min-height:180px;align-items:center;justify-content:center;color:var(--ds-text-muted);border:1px dashed var(--ds-border-strong);border-radius:10px;margin:12px 0'
    empty.textContent = '当前窗口尚未连接终端。请先在「连接」中选择并保存终端。'
    list.appendChild(empty)
    setSwitch('auto-check', updateState.autoCheckOnLaunch === false ? false : true)
    $('check-all').disabled = true
    $('update-all').disabled = true
    $('cancel-update').hidden = true
    renderFooter()
    return
  }
  for (const row of updateState.components) {
    const item = document.createElement('section'); item.className = 'component'; item.dataset.available = row.updateAvailable ? 'true' : 'false'
    const main = document.createElement('div'); main.className = 'component-main'
    const titleRow = document.createElement('div'); titleRow.className = 'component-title-row'
    titleRow.appendChild(runtimeDot(row))
    const title = document.createElement('span'); title.className = 'component-title'; title.textContent = row.title || row.name || row.id; titleRow.appendChild(title)
    titleRow.appendChild(badge(KIND_TEXT[row.kind] || row.kind, row.enabled ? 'info' : 'danger')); main.appendChild(titleRow)
    const desc = document.createElement('p'); desc.className = 'component-desc'; desc.textContent = row.enabled ? row.description : `${row.description}（已停用）`; main.appendChild(desc)
    const meta = document.createElement('p'); meta.className = 'component-meta'; meta.textContent = runtimeMeta(row); meta.title = runtimeMeta(row); main.appendChild(meta)
    const summary = document.createElement('p'); summary.className = 'component-summary'; summary.textContent = row.error || row.summary
    if (row.error) summary.style.color = 'var(--ds-danger)'
    main.appendChild(summary); item.appendChild(main)
    const actions = document.createElement('div'); actions.className = 'component-actions'
    if (row.enabled) {
      const busy = updateState.busy || row.status === 'checking' || row.status === 'updating'
      // The whole panel's cancel button owns the single cancel entry point;
      // during an update this row's primary action yields to it.
      if (updateState.updating) {
        const button = document.createElement('button'); button.className = 'button danger'; button.type = 'button'
        button.textContent = cancelClickPending ? '正在取消…' : '取消更新'; button.disabled = cancelClickPending
        button.addEventListener('click', requestCancelUpdate); actions.appendChild(button)
      } else if (row.updateAvailable) {
        const button = document.createElement('button'); button.className = 'button primary'; button.type = 'button'
        button.textContent = '更新并重启'; button.disabled = busy
        button.addEventListener('click', () => api.updates.action('update-one', { id: row.id })); actions.appendChild(button)
      } else {
        const button = document.createElement('button'); button.className = 'button'; button.type = 'button'
        button.textContent = '检查'; button.disabled = busy
        button.addEventListener('click', () => api.updates.action('check-one', { id: row.id })); actions.appendChild(button)
      }
    } else actions.appendChild(badge('已停用', ''))
    item.appendChild(actions); list.appendChild(item)
  }
  const count = updateState.available.filter(row => row.enabled).length
  setSwitch('auto-check', updateState.autoCheckOnLaunch !== false)
  // Single page: surface the last-check time in the section lead instead of
  // the old per-section footer note.
  {
    const last = updateState.lastCheckAt
      ? new Date(updateState.lastCheckAt).toLocaleString('zh-CN', { hour12: false })
      : '尚未检查'
    $('updates-lead').textContent = `检查与更新当前设备的 Harness。上次检查：${last}`
  }
  const updating = updateState.updating === true
  // Once the update settles (success/failure/cancel) the one-shot cancel
  // state is over; the next update starts with a fresh 「取消更新」 button.
  if (!updating) cancelClickPending = false
  // The shared top bar flips between 「更新并重启」 and 「取消更新」 — the
  // button is never disabled mid-update so cancel always stays clickable.
  $('check-all').disabled = updateState.busy
  $('update-all').disabled = !updating && (updateState.busy || count === 0)
  $('update-all').hidden = updating
  $('cancel-update').hidden = !updating
  // The cancel button is reused across update runs: reset its one-shot
  // click state so a new update always starts with a clickable 「取消更新」.
  $('cancel-update').disabled = updating && cancelClickPending
  $('cancel-update').textContent = cancelClickPending ? '正在取消…' : '取消更新'
  renderFooter()
}
$('check-all').addEventListener('click', () => api.updates.action('check-all', {}))
$('update-all').addEventListener('click', () => api.updates.action('update-all', {}))
function requestCancelUpdate() {
  if (cancelClickPending) return
  cancelClickPending = true
  renderUpdates()
  api.updates.action('cancel-update', {})
}
$('cancel-update').addEventListener('click', requestCancelUpdate)
$('restart-service').addEventListener('click', async () => {
  const button = $('restart-service'); if (button.disabled) return
  button.disabled = true; button.textContent = '重启中…'
  const result = await api.updates.action('restart-service', {})
  button.disabled = false; button.textContent = '重启服务'
  if (result && result.ok === false) status(result.error || '重启失败', false)
})
$('auto-check').addEventListener('click', () => {
  const next = !switchOf('auto-check'); setSwitch('auto-check', next)
  updateState.autoCheckOnLaunch = next
  api.updates.action('toggle-auto', { value: next })
})
$('copy-log').addEventListener('click', () => api.updates.action('copy-log', {}))
$('reveal-log').addEventListener('click', () => api.updates.action('reveal-log', {}))
let logBooted = false
async function refreshUpdatesLog() {
  const text = await api.updates.getLog()
  const log = $('log')
  log.textContent = text && text.trim() !== '' ? `${text.trim()}\n` : '等待操作…\n'
  log.scrollTop = log.scrollHeight
  logBooted = true
}
function appendLog(line) {
  const log = $('log')
  if (!logBooted) log.textContent = ''
  log.textContent += `${line}\n`
  log.scrollTop = log.scrollHeight
}
api.updates.onLog(appendLog)
api.updates.onState(state => { updateState = state; renderUpdates() })

/** Live connection strip for the connection page; no page jump on connect. */
function renderLive(live) {
  const strip = $('live-strip')
  strip.textContent = ''
  if (live && live.state === 'ready' && live.url) {
    strip.hidden = false
    // Healthy state: normal text colour with a leading green dot — the text
    // itself stays readable/copyable instead of being tinted green.
    const dot = document.createElement('span')
    dot.className = 'live-dot'
    strip.appendChild(dot)
    strip.appendChild(document.createTextNode('当前连接：' + live.url + ' — ' + live.detail))
  } else if (live && live.detail) {
    strip.hidden = false
    strip.textContent = '状态：' + live.detail
  } else {
    strip.hidden = true
  }
}
api.onLive && api.onLive(renderLive)

// ── appearance (theme picker) ──────────────────────────────────────────────

const THEMES = [
  { id: 'default', name: '默认', desc: '跟随系统，在液态玻璃浅 / 深之间自动切换', preview: { bg: 'linear-gradient(135deg,#6e6ae6 0%,#7a5cf0 45%,#ff5c5c 100%)', sidebar: 'rgba(255,255,255,0.42)', surface: 'rgba(255,255,255,0.6)', accent: '#0a84ff' } },
  { id: 'ios-flat', name: 'iOS 扁平', desc: '简洁扁平、高饱和系统色（浅）', preview: { bg: '#f2f2f7', sidebar: '#f7f7fa', surface: '#ffffff', accent: '#007aff' } },
  { id: 'ios-flat-dark', name: 'iOS 扁平深色', desc: 'iOS 深色模式、纯黑不透明表面', preview: { bg: '#000000', sidebar: '#1c1c1e', surface: '#1c1c1e', accent: '#0a84ff' } },
  { id: 'liquid-glass', name: '液态玻璃', desc: '半透明玻璃质感与折射光影（浅）', preview: { bg: 'linear-gradient(135deg,#6e6ae6 0%,#7a5cf0 45%,#ff5c5c 100%)', sidebar: 'rgba(255,255,255,0.42)', surface: 'rgba(255,255,255,0.6)', accent: '#0a84ff' } },
  { id: 'liquid-glass-dark', name: '液态玻璃深色', desc: '深色磨砂玻璃、低亮度折射背景', preview: { bg: 'linear-gradient(135deg,#23234a 0%,#3a2b5f 50%,#4a1f3a 100%)', sidebar: 'rgba(22,22,34,0.55)', surface: 'rgba(30,30,46,0.55)', accent: '#0a84ff' } },
]

function swatch(bg, cssText) {
  const el = document.createElement('span')
  el.style.cssText = `position:absolute;${cssText};background:${bg};box-shadow:inset 0 1px 0 rgba(255,255,255,0.2)`
  return el
}

function syncThemeCards() {
  for (const card of document.querySelectorAll('#theme-grid .theme-card')) {
    const on = card.dataset.theme === activeTheme
    card.setAttribute('aria-checked', on ? 'true' : 'false')
    card.setAttribute('aria-pressed', on ? 'true' : 'false')
  }
}

function renderThemes() {
  const grid = $('theme-grid')
  grid.textContent = ''
  for (const t of THEMES) {
    const card = document.createElement('button')
    card.type = 'button'
    card.className = 'theme-card'
    card.dataset.theme = t.id
    card.setAttribute('role', 'radio')
    card.setAttribute('aria-checked', t.id === activeTheme ? 'true' : 'false')
    card.setAttribute('aria-pressed', t.id === activeTheme ? 'true' : 'false')

    const preview = document.createElement('div')
    preview.className = 'theme-preview'
    preview.style.background = t.preview.bg
    preview.appendChild(swatch(t.preview.sidebar, 'left:8px;top:8px;bottom:8px;width:26%;border-radius:6px'))
    preview.appendChild(swatch(t.preview.surface, 'left:calc(26% + 14px);top:8px;right:8px;height:42%;border-radius:6px'))
    preview.appendChild(swatch(t.preview.accent, 'left:calc(26% + 14px);top:calc(8px + 42% + 6px);width:38%;height:18%;border-radius:999px'))

    const check = document.createElement('span')
    check.className = 'theme-check'
    check.textContent = '✓'
    preview.appendChild(check)

    const name = document.createElement('div')
    name.className = 'theme-card-name'
    name.textContent = t.name
    const desc = document.createElement('div')
    desc.className = 'theme-card-desc'
    desc.textContent = t.desc

    card.appendChild(preview)
    card.appendChild(name)
    card.appendChild(desc)

    card.addEventListener('click', () => {
      if (activeTheme === t.id) return
      activeTheme = t.id
      document.documentElement.dataset.theme = t.id
      syncThemeCards()
      api.setTheme(t.id)
    })
    grid.appendChild(card)
  }
}

// Re-sync the selection when the theme changes from another window/panel.
api.onTheme && api.onTheme(theme => {
  if (!THEMES.some(t => t.id === theme)) return
  activeTheme = theme
  document.documentElement.dataset.theme = theme
  syncThemeCards()
})

// ── save connection settings ────────────────────────────────────────────────

async function saveSettings() {
  const mode = currentMode()
  const raw = {
    mode,
    // Ports are managed automatically (`dsh web --port 0`, SSH forward +30
    // fallback). Preserve previously persisted values for compatibility, but
    // never ask the user to fill them in.
    local: { repoDir: $('local-repo').value.trim(), repoUrl: $('local-url').value.trim(), dshHome: $('local-home').value.trim(), port: savedSettings?.local?.port ?? 3080 },
    ssh: { host: selectedSshHost(), remoteRepoUrl: $('ssh-url').value.trim(), remoteRepoDir: $('ssh-dir').value.trim(), remotePort: savedSettings?.ssh?.remotePort ?? 3080, localPort: savedSettings?.ssh?.localPort ?? 3080 },
  }
  if (mode === 'local' && raw.local.repoDir === '') { status('请填写仓库目录（默认：产品目录下的 deepseek-harness/）。', false); return }
  if (mode === 'ssh' && raw.ssh.host === '') { status('请选择 SSH 主机，或填写自定义地址。', false); return }
  const save = $('save-settings'); if (save) save.disabled = true
  status('保存并连接…')
  const outcome = await api.save(raw)
  if (save) save.disabled = false
  if (!outcome.ok) status(outcome.error || '保存失败', false)
  else status('已保存，正在连接…')
}

// ── boot ────────────────────────────────────────────────────────────────────

api.getState().then(state => {
  const s = state.settings
  savedSettings = s
  activeTheme = state.theme || 'default'
  activeMode = s.mode === 'ssh' ? 'ssh' : 'local'
  deviceTerminal = state.terminal || (activeMode === 'ssh' ? 'SSH' : '本地')
  $('titlebar-terminal').textContent = `DSH-[${deviceTerminal}]`
  sshHostEntries = state.sshHosts
  const select = $('ssh-host'); const current = s.ssh?.host ?? ''; select.textContent = ''
  for (const entry of state.sshHosts) {
    const option = document.createElement('option'); option.value = entry.alias; option.textContent = `${entry.alias}（${entry.detail}）`
    if (entry.alias === current) option.selected = true; select.appendChild(option)
  }
  const custom = document.createElement('option'); custom.value = '__custom__'; custom.textContent = '自定义地址…'
  if (!state.sshHosts.some(entry => entry.alias === current)) custom.selected = true
  select.appendChild(custom)
  if (!state.sshHosts.some(entry => entry.alias === current)) $('ssh-custom').value = current
  for (const button of document.querySelectorAll('#mode-switch button')) button.classList.toggle('active', button.dataset.mode === s.mode)
  $('local-repo').value = s.local?.repoDir ?? ''; $('local-url').value = s.local?.repoUrl ?? ''
  $('local-home').value = s.local?.dshHome ?? '~/.dsh-dev'
  $('ssh-url').value = s.ssh?.remoteRepoUrl ?? ''; $('ssh-dir').value = s.ssh?.remoteRepoDir ?? '~/deepseek-harness'
  const update = s.update ?? {}
  updateState.autoCheckOnLaunch = update.autoCheckOnLaunch !== false
  setSwitch('auto-check', updateState.autoCheckOnLaunch)
  renderLive(state.live)
  renderThemes()
  refreshMode(); refreshSshHost(); renderFooter()
  // Single page: the log card is always visible, so hydrate it once at boot.
  void refreshUpdatesLog()
  // Anchor from the query param (launcher / menu deep links).
  const section = ['connection', 'updates'].includes(params.get('section')) ? params.get('section') : ''
  if (section !== '') anchorSection(section)
})

api.updates.getState().then(state => { updateState = state; renderUpdates() })
</script>
</body>
</html>
