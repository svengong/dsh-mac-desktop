<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH — 设置</title>
<link rel="stylesheet" href="./shell.css">
<style>
  body { width: 100%; height: 100vh; }
  .section-lead { margin: 2px 0 12px; color: var(--ds-text-muted); font-size: 12.5px; }
  #update-components .component { margin-bottom: 0; }
  .nav-badge { min-width: 18px; padding: 0 6px; text-align: center; }
</style>
</head>
<body>
<div class="settings-shell">
  <aside class="settings-sidebar">
    <div class="settings-brand">
      <span class="settings-brand-mark">DS</span>
      <span>DSH</span>
    </div>
    <nav class="settings-nav" aria-label="设置栏目">
      <button type="button" data-section="connection" class="active">
        <span class="nav-icon">⌁</span><span>连接</span>
      </button>
      <button type="button" data-section="updates">
        <span class="nav-icon">↻</span><span>更新管理</span>
        <span class="badge warn nav-badge" id="nav-update-count" hidden>0</span>
      </button>
    </nav>
    <div class="settings-sidebar-footer">桌面壳 · 本地 / SSH 远程</div>
  </aside>

  <main class="settings-main">
    <header class="settings-titlebar">
      <div class="settings-title-group">
        <h1 id="section-title">连接</h1>
        <span class="titlebar-subtitle" id="section-subtitle">选择运行 DeepSeek Harness 的方式</span>
      </div>
      <span class="badge info titlebar-terminal" id="titlebar-terminal">DSH-[本地]</span>
      <div class="titlebar-actions">
        <button id="close-window" class="button quiet small" type="button" aria-label="关闭设置">关闭</button>
      </div>
    </header>

    <div class="settings-scroll">
      <section id="section-connection" class="settings-section">
        <p class="section-lead">本地模式直接使用本机仓库；SSH 远程模式参考 VS Code Remote。</p>
        <div id="live-strip" class="live-strip ok" hidden></div>

        <div class="card">
          <div class="card-head">
            <h2 class="card-title">连接方式</h2>
            <div class="segmented" id="mode-switch" role="tablist" aria-label="连接方式">
              <button type="button" data-mode="local" class="active" role="tab" aria-selected="true">本地</button>
              <button type="button" data-mode="ssh" role="tab" aria-selected="false">SSH 远程</button>
            </div>
          </div>
          <div class="card-body">
            <section id="local-fields">
              <div class="field">
                <label class="field-label" for="local-repo">仓库目录 <small>（默认：产品目录下的 deepseek-harness/）</small></label>
                <div class="picker">
                  <input id="local-repo" class="input" type="text" placeholder="deepseek-harness">
                  <button id="pick-local" class="button" type="button">选择…</button>
                </div>
              </div>
              <div class="field">
                <label class="field-label" for="local-url">仓库地址 <small>（可选；目录不存在时自动克隆）</small></label>
                <input id="local-url" class="input" type="text" placeholder="https://github.com/deepseek-ai/deepseek-harness.git">
              </div>
              <div class="field">
                <label class="field-label" for="local-home">数据目录（dsh home）</label>
                <input id="local-home" class="input" type="text" value="~/.dsh-dev">
              </div>
            </section>

            <section id="ssh-fields" class="hidden">
              <div class="field">
                <label class="field-label" for="ssh-host">SSH 主机 <small>（~/.ssh/config 别名或 user@host[:port]）</small></label>
                <div class="picker">
                  <select id="ssh-host" class="select"></select>
                  <button id="test-ssh" class="button" type="button">测试连接</button>
                </div>
              </div>
              <div class="field" id="ssh-custom-row" hidden>
                <label class="field-label" for="ssh-custom">自定义地址</label>
                <input id="ssh-custom" class="input" type="text" placeholder="dev@10.0.0.8">
              </div>
              <p class="field-hint" id="ssh-host-detail"></p>
              <p class="field-hint" id="ssh-test-result"></p>
              <div class="row-grid">
                <div class="field"><label class="field-label" for="ssh-url">远程仓库地址</label><input id="ssh-url" class="input" type="text" placeholder="https://github.com/deepseek-ai/deepseek-harness.git"></div>
                <div class="field"><label class="field-label" for="ssh-dir">远程仓库目录</label><input id="ssh-dir" class="input" type="text" value="~/deepseek-harness"></div>
              </div>
            </section>
          </div>
        </div>
      </section>

      <section id="section-updates" class="settings-section hidden">
        <p class="section-lead">统一检查 Harness 与当前设备自己的 npm 插件、git 预设；更新源只属于当前连接的设备。</p>
        <div class="top-actions">
          <button id="check-all" class="button" type="button">检查全部</button>
          <button id="update-all" class="button primary" type="button">更新全部并重启</button>
          <button id="restart-service" class="button" type="button">重启服务</button>
          <button id="add-npm" class="button small" type="button">＋ npm 插件</button>
          <button id="add-preset" class="button small" type="button">＋ Git 预设</button>
          <span style="flex:1"></span>
          <label class="switch-row">
            <span style="color:var(--ds-text-muted);font-size:12px">启动自动检查</span>
            <button id="auto-check" class="switch" type="button" role="switch" aria-label="启动自动检查"></button>
          </label>
        </div>

        <div id="add-form-wrap" class="card" style="display:none"></div>

        <div class="component-list" id="update-components" style="margin-bottom:12px" aria-live="polite"></div>

        <div class="log-wrap updates-log" id="update-log-wrap">
          <div class="log-tools">
            <span class="log-label">操作日志</span>
            <span>
              <button id="copy-log" class="button quiet small" type="button">复制</button>
              <button id="reveal-log" class="button quiet small" type="button">打开日志文件</button>
            </span>
          </div>
          <pre class="log" id="log">等待操作…</pre>
        </div>
      </section>

    </div>

    <footer class="settings-footer">
      <span class="footer-note" id="footer-note">已载入当前设置</span>
      <span class="footer-actions" id="footer-actions"></span>
    </footer>
  </main>
</div>

<script>
'use strict'
const $ = id => document.getElementById(id)
const api = window.desktopDialog

const params = new URLSearchParams(location.search)
const embedded = params.get('embedded') === '1'
if (embedded) document.body.classList.add('embedded')
let sshHostEntries = []
let nextPluginSeq = 1
let activeMode = 'local'
let activeSection = ['connection', 'updates'].includes(params.get('section')) ? params.get('section') : 'connection'
let updateState = { busy: false, autoCheckOnLaunch: true, lastCheckAt: '', components: [], available: [] }
let deviceTerminal = '本地'
let savedSettings = null

function status(text, ok) {
  const el = $('footer-note')
  el.textContent = text
  el.style.color = ok === false ? 'var(--ds-warning)' : 'var(--ds-text-muted)'
}
function switchOf(id) { return $(id).getAttribute('aria-checked') === 'true' }
function setSwitch(id, value) { $(id).setAttribute('aria-checked', value ? 'true' : 'false') }

// ── section navigation ──────────────────────────────────────────────────────

function refreshSections() {
  for (const button of document.querySelectorAll('.settings-nav button')) {
    button.classList.toggle('active', button.dataset.section === activeSection)
  }
  for (const name of ['connection', 'updates']) {
    $(`section-${name}`).classList.toggle('hidden', name !== activeSection)
  }
  const meta = {
    connection: ['连接', '选择运行 DeepSeek Harness 的方式'],
    updates: ['更新管理', '检查与升级当前设备的 Harness、npm 插件和 git 预设'],
  }
  $('section-title').textContent = meta[activeSection][0]
  $('section-subtitle').textContent = meta[activeSection][1]
  renderFooter()
}
function selectSection(name) {
  if (!['connection', 'updates'].includes(name)) name = 'connection'
  activeSection = name
  refreshSections()
  if (name === 'updates') void refreshUpdatesLog()
}
for (const button of document.querySelectorAll('.settings-nav button')) {
  button.addEventListener('click', () => selectSection(button.dataset.section))
}
$('close-window').addEventListener('click', () => {
  if (api.closePanel) api.closePanel()
  else window.close()
})
api.onSection && api.onSection(section => selectSection(section))
refreshSections()

function renderFooter() {
  const actions = $('footer-actions')
  actions.textContent = ''
  if (activeSection === 'updates') {
    const last = updateState.lastCheckAt
      ? new Date(updateState.lastCheckAt).toLocaleString('zh-CN', { hour12: false })
      : '尚未检查'
    status(`上次检查：${last}${updateState.busy ? ' · 任务执行中' : ''}`)
    return
  }
  const save = document.createElement('button')
  save.id = 'save-settings'
  save.className = 'button primary'
  save.type = 'button'
  save.textContent = '保存并连接'
  save.addEventListener('click', saveSettings)
  actions.appendChild(save)
}

// ── connection form ─────────────────────────────────────────────────────────

function currentMode() { return document.querySelector('#mode-switch .active').dataset.mode }
function refreshMode() {
  const ssh = currentMode() === 'ssh'
  $('local-fields').classList.toggle('hidden', ssh)
  $('ssh-fields').classList.toggle('hidden', !ssh)
  for (const button of document.querySelectorAll('#mode-switch button')) {
    button.classList.toggle('active', button.dataset.mode === currentMode())
    button.setAttribute('aria-selected', button.dataset.mode === currentMode() ? 'true' : 'false')
  }
}
document.querySelectorAll('#mode-switch button').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('#mode-switch button').forEach(other => other.classList.toggle('active', other === button))
    activeMode = button.dataset.mode === 'ssh' ? 'ssh' : 'local'
    refreshMode()
  })
})
function selectedSshHost() { return $('ssh-host').value === '__custom__' ? $('ssh-custom').value.trim() : $('ssh-host').value }
function refreshSshHost() {
  const custom = $('ssh-host').value === '__custom__'
  $('ssh-custom-row').hidden = !custom
  const entry = sshHostEntries.find(item => item.alias === $('ssh-host').value)
  $('ssh-host-detail').textContent = entry ? `→ ${entry.detail}` : custom ? '→ 直连，不经 ~/.ssh/config' : ''
}
$('pick-local').addEventListener('click', async () => { const dir = await api.pickDirectory(); if (dir) $('local-repo').value = dir })
$('ssh-host').addEventListener('change', refreshSshHost)
$('ssh-custom').addEventListener('input', refreshSshHost)
$('test-ssh').addEventListener('click', async () => {
  const result = $('ssh-test-result')
  const target = selectedSshHost()
  result.className = 'field-hint'
  if (target === '') { result.textContent = '请先选择 SSH 主机'; result.style.color = 'var(--ds-danger)'; return }
  result.textContent = '测试中…'; result.style.color = 'var(--ds-text-muted)'
  const outcome = await api.testSsh(target)
  result.textContent = outcome.ok ? '连接成功' : `失败：${outcome.message}`
  result.style.color = outcome.ok ? 'var(--ds-success)' : 'var(--ds-danger)'
})

// ── plugin source editor ────────────────────────────────────────────────────

function repoDisplayName(url) {
  return String(url || '').replace(/\/+$/, '').split('/').pop()?.replace(/\.git$/, '') || ''
}
function stripQuotes(value) {
  const cleaned = String(value || '').trim()
  if (cleaned.length >= 2 && ((cleaned.startsWith('"') && cleaned.endsWith('"')) || (cleaned.startsWith("'") && cleaned.endsWith("'")))) {
    return cleaned.slice(1, -1).trim()
  }
  return cleaned
}
function packageNameFromSpec(spec) {
  let value = stripQuotes(spec)
  if (value === '') return ''
  if (value.startsWith('npm:')) value = value.slice(4)
  if (value.startsWith('@')) {
    const slash = value.indexOf('/')
    if (slash <= 1) return ''
    const scope = value.slice(0, slash)
    const rest = value.slice(slash + 1)
    const at = rest.indexOf('@')
    const name = at === -1 ? rest : rest.slice(0, at)
    return name === '' ? '' : `${scope}/${name}`
  }
  if (/^(github:|gitlab:|bitbucket:|git\+|git@|file:|link:|\.|\.\.|\/|~|https?:\/\/)/.test(value)) return ''
  const at = value.indexOf('@')
  return (at === -1 ? value : value.slice(0, at)).trim() || ''
}
/**
 * Accept either a raw pnpm `add` spec or a full official command:
 * `dsh plugin --profile web add dsh-example` → spec `dsh-example`,
 * profile `web`. The shell only forwards the spec after the official `add`
 * verb; the command is never shell-executed.
 */
function applyInstallCommand(entry, value) {
  const cleaned = stripQuotes(value)
  const command = /^dsh\s+plugin\b[\s\S]*?\badd\s+([\s\S]+)$/i.exec(cleaned)
  if (command) {
    const profile = /(?:^|\s)--profile\s+(\S+)/.exec(cleaned)
    if (profile) entry.profile = profile[1]
    entry.installSpec = stripQuotes(command[1].trim())
  } else {
    entry.installSpec = cleaned
  }
  if (!entry._packageNameEdited) {
    entry.packageName = packageNameFromSpec(entry.installSpec) || ''
  }
  if (!entry._titleEdited) {
    entry.title = packageNameFromSpec(entry.installSpec) || '新 npm 插件'
  }
}
function pluginDescription(entry) {
  if (entry.kind === 'npm') {
    const spec = entry.installSpec || entry.packageName || entry.id
    return `dsh plugin --profile ${entry.profile || 'web'} add ${spec}`
  }
  return `git pull 后同步 ${entry.sourceDir || 'preset'} → ~/.dsh/.agent-presets/${entry.presetId || entry.id}`
}
function nextPluginId() {
  let id = `plugin-${nextPluginSeq}`; nextPluginSeq += 1
  while (updateState.components.some(entry => entry.id === id)) { id = `plugin-${nextPluginSeq}`; nextPluginSeq += 1 }
  return id
}
function fieldEl(labelText, control) {
  const field = document.createElement('div'); field.className = 'field'
  const label = document.createElement('label'); label.className = 'field-label'; label.textContent = labelText
  field.appendChild(label); field.appendChild(control); return field
}
function inputEl(entry, key, placeholder) {
  const input = document.createElement('input'); input.className = 'input mono'; input.type = 'text'
  input.placeholder = placeholder || ''; input.value = entry[key] || ''
  input.addEventListener('input', () => { entry[key] = input.value }); return input
}
function pickerInputEl(entry, key) {
  const wrap = document.createElement('div'); wrap.className = 'picker'
  const input = inputEl(entry, key, '~/OpenSoft/plugin')
  const button = document.createElement('button'); button.className = 'button'; button.type = 'button'; button.textContent = '选择…'
  button.addEventListener('click', async () => { const dir = await api.pickDirectory(); if (dir) { input.value = dir; entry[key] = dir } })
  wrap.appendChild(input); wrap.appendChild(button); return wrap
}
function checkoutDirEl(entry) {
  if (activeMode === 'ssh') return inputEl(entry, 'checkoutDir', '~/OpenSoft/plugin')
  return pickerInputEl(entry, 'checkoutDir')
}
// ── plugin source add form ────────────────────────────────────────────────

let addingEntry = null

function openAddForm(kind) {
  const id = nextPluginId()
  addingEntry = kind === 'npm'
    ? { id, name: '', title: '新 npm 插件', _titleEdited: false, kind: 'npm', installSpec: '', packageName: '', profile: 'web', registryUrl: 'https://registry.npmjs.org', enabled: true }
    : { id, name: id, title: id, _titleEdited: false, kind: 'git-preset', repoUrl: '', checkoutDir: `~/OpenSoft/${id}`, sourceDir: 'preset', presetId: id, enabled: true }
  renderAddForm()
}

function renderAddForm() {
  const wrap = $('add-form-wrap')
  wrap.textContent = ''
  if (addingEntry === null) { wrap.style.display = 'none'; return }
  wrap.style.display = ''
  const head = document.createElement('div'); head.className = 'card-head'
  const h = document.createElement('h2'); h.className = 'card-title'
  h.textContent = addingEntry.kind === 'npm' ? '添加 npm 插件' : '添加 Git 预设'
  head.appendChild(h); wrap.appendChild(head)
  const body = document.createElement('div'); body.className = 'card-body'
  body.appendChild(addEntryCard(addingEntry))
  const actions = document.createElement('div')
  actions.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;margin-top:10px'
  const cancel = document.createElement('button'); cancel.className = 'button'; cancel.type = 'button'; cancel.textContent = '取消'
  cancel.addEventListener('click', () => { addingEntry = null; renderAddForm() })
  const submit = document.createElement('button'); submit.className = 'button primary'; submit.type = 'button'; submit.textContent = '添加'
  submit.addEventListener('click', submitAdd)
  actions.appendChild(cancel); actions.appendChild(submit)
  body.appendChild(actions); wrap.appendChild(body)
}

function addEntryCard(entry) {
  const main = document.createElement('div')
  const titleInput = inputEl(entry, 'title', entry.kind === 'npm' ? '自动识别' : entry.id)
  titleInput.addEventListener('input', () => { entry._titleEdited = true })
  main.appendChild(fieldEl('显示名', titleInput))
  const fields = document.createElement('div'); fields.className = 'row-grid source-fields'
  if (entry.kind === 'npm') {
    const packageInput = inputEl(entry, 'packageName', '自动从安装参数识别')
    packageInput.addEventListener('input', () => { entry._packageNameEdited = packageInput.value.trim() !== '' })
    const specInput = document.createElement('input')
    specInput.className = 'input mono'; specInput.type = 'text'; specInput.value = entry.installSpec || ''
    specInput.placeholder = 'dsh plugin --profile web add dsh-example'
    specInput.addEventListener('input', () => {
      applyInstallCommand(entry, specInput.value)
      if (!entry._packageNameEdited) packageInput.value = entry.packageName || ''
    })
    const specField = fieldEl('安装命令 / pnpm add 参数', specInput)
    specField.style.gridColumn = '1 / -1'
    const specHint = document.createElement('p'); specHint.className = 'field-hint'
    specHint.textContent = '可直接粘贴完整命令，也可只填 pnpm add 参数：dsh-example、@scope/pkg@^1、github:owner/repo、file:./plugin、./plugin.tgz'
    specField.appendChild(specHint); fields.appendChild(specField)
    fields.appendChild(fieldEl('包名（用于 registry 版本检查）', packageInput))
    fields.appendChild(fieldEl('profile', inputEl(entry, 'profile', 'web')))
    const registryField = fieldEl('npm registry', inputEl(entry, 'registryUrl', 'https://registry.npmjs.org'))
    registryField.style.gridColumn = '1 / -1'; fields.appendChild(registryField)
  } else {
    const repoInput = inputEl(entry, 'repoUrl', 'https://github.com/you/plugin.git')
    repoInput.addEventListener('input', () => { if (!entry._titleEdited) { entry.title = repoDisplayName(entry.repoUrl) || entry.presetId || entry.id } })
    const presetInput = inputEl(entry, 'presetId', entry.id)
    presetInput.addEventListener('input', () => { if (!entry._titleEdited) { entry.title = repoDisplayName(entry.repoUrl) || entry.presetId || entry.id } })
    fields.appendChild(fieldEl('仓库地址', repoInput))
    fields.appendChild(fieldEl(activeMode === 'ssh' ? '远端源目录（remote path）' : '本地源目录', checkoutDirEl(entry)))
    fields.appendChild(fieldEl('源子目录（以插件 README 为准）', inputEl(entry, 'sourceDir', 'preset')))
    fields.appendChild(fieldEl('安装名（$DSH_HOME/.agent-presets/…）', presetInput))
  }
  main.appendChild(fields)
  return main
}

function componentFromEntry(entry) {
  if (entry.kind === 'npm') {
    const spec = (entry.installSpec || entry.packageName || '').trim()
    const title = (entry.title || '').trim() || packageNameFromSpec(spec) || spec || entry.id
    return {
      id: entry.id, kind: 'npm', title,
      installSpec: spec,
      packageName: (entry.packageName || '').trim() || packageNameFromSpec(spec) || entry.id,
      profile: (entry.profile || '').trim() || 'web',
      registryUrl: (entry.registryUrl || '').trim() || 'https://registry.npmjs.org',
      enabled: true,
    }
  }
  const title = (entry.title || '').trim() || (entry.presetId || '').trim() || repoDisplayName(entry.repoUrl) || entry.id
  return {
    id: entry.id, kind: 'git-preset', title,
    repoUrl: (entry.repoUrl || '').trim(),
    checkoutDir: (entry.checkoutDir || '').trim(),
    sourceDir: (entry.sourceDir || '').trim() || 'preset',
    presetId: (entry.presetId || '').trim() || entry.id,
    enabled: true,
  }
}

function componentFromRow(row) {
  if (row.kind === 'npm') {
    return {
      id: row.id, kind: 'npm', title: row.title || row.name || row.id,
      installSpec: row.installSpec || row.packageName || row.id,
      packageName: row.packageName || '',
      profile: row.profile || 'web',
      registryUrl: row.registryUrl || 'https://registry.npmjs.org',
      enabled: row.enabled !== false,
    }
  }
  return {
    id: row.id, kind: 'git-preset', title: row.title || row.presetId || row.id,
    repoUrl: row.repoUrl || '',
    checkoutDir: row.checkoutDir || '',
    sourceDir: row.sourceDir || 'preset',
    presetId: row.presetId || row.id,
    enabled: row.enabled !== false,
  }
}

function validateAddEntry(entry) {
  if (entry.kind === 'npm') {
    const spec = (entry.installSpec || '').trim()
    if (spec === '') return `npm 插件 ${entry.title || entry.id} 缺少安装命令/参数`
    if (spec.includes('\n')) return '安装参数不能包含换行'
  }
  if (entry.kind === 'git-preset' && (entry.repoUrl || '').trim() === '' && (entry.checkoutDir || '').trim() === '') {
    return `Git 预设 ${entry.title || entry.id} 需要仓库地址或本地源目录`
  }
  return null
}

function submitAdd() {
  if (addingEntry === null) return
  const error = validateAddEntry(addingEntry)
  if (error !== null) { status(error, false); return }
  const components = updateState.components
    .filter(row => row.id !== 'harness')
    .map(componentFromRow)
  components.push(componentFromEntry(addingEntry))
  api.updates.action('save-sources', { components }).then(result => {
    if (result && result.ok === false) { status(result.error || '添加失败', false); return }
    status('已添加，下次检查生效', true)
    addingEntry = null
    renderAddForm()
  })
}

$('add-npm').addEventListener('click', () => openAddForm('npm'))
$('add-preset').addEventListener('click', () => openAddForm('git-preset'))

// ── update manager runtime ──────────────────────────────────────────────────

const KIND_TEXT = { harness: 'Harness', npm: 'npm 插件', 'git-preset': 'Git 预设' }
function runtimeDot(row) {
  const state = row.updateAvailable ? 'available' : row.status
  const busy = row.status === 'checking' || row.status === 'updating'
  const span = document.createElement('span'); span.className = `status-dot${busy ? ' pulse' : ''}`
  span.dataset.status = state; span.setAttribute('aria-hidden', 'true'); return span
}
function badge(text, cls) { const span = document.createElement('span'); span.className = `badge ${cls || ''}`; span.textContent = text; return span }
function runtimeMeta(row) {
  const parts = []
  if (row.kind === 'npm') parts.push(`${row.packageName || row.name} · ${row.profile || 'web'}`)
  if (row.kind === 'git-preset') parts.push(row.repoUrl || row.checkoutDir)
  if (row.current) parts.push(`当前 ${row.current}`)
  if (row.latest && row.latest !== row.current) parts.push(`最新 ${row.latest}`)
  return parts.join('  ·  ')
}
function sourceOf(row) {
  if (row.kind === 'git-preset') return row.repoUrl || row.checkoutDir || ''
  return row.installSpec || row.packageName || ''
}
function renderUpdates() {
  const list = $('update-components'); list.textContent = ''
  for (const row of updateState.components) {
    const item = document.createElement('section'); item.className = 'component'; item.dataset.available = row.updateAvailable ? 'true' : 'false'
    const main = document.createElement('div'); main.className = 'component-main'
    const titleRow = document.createElement('div'); titleRow.className = 'component-title-row'
    titleRow.appendChild(runtimeDot(row))
    const title = document.createElement('span'); title.className = 'component-title'; title.textContent = row.title || row.presetId || row.name || row.id; titleRow.appendChild(title)
    titleRow.appendChild(badge(KIND_TEXT[row.kind] || row.kind, row.enabled ? 'info' : 'danger')); main.appendChild(titleRow)
    const desc = document.createElement('p'); desc.className = 'component-desc'; desc.textContent = row.enabled ? row.description : `${row.description}（已停用）`; main.appendChild(desc)
    const meta = document.createElement('p'); meta.className = 'component-meta'; meta.textContent = runtimeMeta(row); meta.title = runtimeMeta(row); main.appendChild(meta)
    const source = sourceOf(row)
    if (row.kind !== 'harness' && source !== '') {
      const srcRow = document.createElement('div'); srcRow.className = 'component-meta'
      const code = document.createElement('code'); code.textContent = source; code.title = source
      code.style.cssText = 'display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ds-text-secondary)'
      srcRow.appendChild(code); main.appendChild(srcRow)
    }
    const summary = document.createElement('p'); summary.className = 'component-summary'; summary.textContent = row.error || row.summary
    if (row.error) summary.style.color = 'var(--ds-danger)'
    main.appendChild(summary); item.appendChild(main)
    const actions = document.createElement('div'); actions.className = 'component-actions'
    if (row.enabled) {
      const busy = updateState.busy || row.status === 'checking' || row.status === 'updating'
      if (row.updateAvailable) {
        const button = document.createElement('button'); button.className = 'button primary'; button.type = 'button'
        button.textContent = row.kind === 'harness' ? '更新并重启' : '更新'; button.disabled = busy
        button.addEventListener('click', () => api.updates.action('update-one', { id: row.id })); actions.appendChild(button)
      } else {
        const button = document.createElement('button'); button.className = 'button'; button.type = 'button'
        button.textContent = '检查'; button.disabled = busy
        button.addEventListener('click', () => api.updates.action('check-one', { id: row.id })); actions.appendChild(button)
      }
    } else actions.appendChild(badge('已停用', ''))
    if (row.kind !== 'harness' && source !== '') {
      const copy = document.createElement('button'); copy.className = 'button quiet small'; copy.type = 'button'; copy.textContent = '复制'
      copy.setAttribute('aria-label', `复制 ${row.title || row.id} 安装源`)
      copy.addEventListener('click', () => api.updates.action('copy-source', { id: row.id }))
      actions.appendChild(copy)
    }
    if (row.kind !== 'harness' && !row.builtin) {
      const del = document.createElement('button'); del.className = 'button quiet small'; del.type = 'button'; del.textContent = '删除'
      del.setAttribute('aria-label', `删除 ${row.title || row.id}`)
      del.addEventListener('click', () => {
        if (del.textContent === '删除') {
          del.textContent = '确认删除？'
          setTimeout(() => { if (del.textContent === '确认删除？') del.textContent = '删除' }, 3000)
        } else {
          api.updates.action('delete-component', { id: row.id })
        }
      })
      actions.appendChild(del)
    }
    item.appendChild(actions); list.appendChild(item)
  }
  const count = updateState.available.filter(row => row.enabled).length
  const badgeEl = $('nav-update-count'); badgeEl.hidden = count === 0; badgeEl.textContent = String(count)
  setSwitch('auto-check', updateState.autoCheckOnLaunch !== false)
  $('check-all').disabled = updateState.busy
  $('update-all').disabled = updateState.busy || count === 0
  renderFooter()
}
$('check-all').addEventListener('click', () => api.updates.action('check-all', {}))
$('update-all').addEventListener('click', () => api.updates.action('update-all', {}))
$('restart-service').addEventListener('click', async () => {
  const button = $('restart-service'); if (button.disabled) return
  button.disabled = true; button.textContent = '重启中…'
  const result = await api.updates.action('restart-service', {})
  button.disabled = false; button.textContent = '重启服务'
  if (result && result.ok === false) status(result.error || '重启失败', false)
})
$('auto-check').addEventListener('click', () => {
  const next = !switchOf('auto-check'); setSwitch('auto-check', next)
  updateState.autoCheckOnLaunch = next
  api.updates.action('toggle-auto', { value: next })
})
$('copy-log').addEventListener('click', () => api.updates.action('copy-log', {}))
$('reveal-log').addEventListener('click', () => api.updates.action('reveal-log', {}))
let logBooted = false
async function refreshUpdatesLog() {
  const text = await api.updates.getLog()
  const log = $('log')
  log.textContent = text && text.trim() !== '' ? `${text.trim()}\n` : '等待操作…\n'
  log.scrollTop = log.scrollHeight
  logBooted = true
}
function appendLog(line) {
  const log = $('log')
  if (!logBooted) log.textContent = ''
  log.textContent += `${line}\n`
  log.scrollTop = log.scrollHeight
}
api.updates.onLog(appendLog)
api.updates.onState(state => { updateState = state; renderUpdates() })

// ── save connection settings ────────────────────────────────────────────────

async function saveSettings() {
  const mode = currentMode()
  const raw = {
    mode,
    // Ports are managed automatically (`dsh web --port 0`, SSH forward +30
    // fallback). Preserve previously persisted values for compatibility, but
    // never ask the user to fill them in.
    local: { repoDir: $('local-repo').value.trim(), repoUrl: $('local-url').value.trim(), dshHome: $('local-home').value.trim(), port: savedSettings?.local?.port ?? 3080 },
    ssh: { host: selectedSshHost(), remoteRepoUrl: $('ssh-url').value.trim(), remoteRepoDir: $('ssh-dir').value.trim(), remotePort: savedSettings?.ssh?.remotePort ?? 3080, localPort: savedSettings?.ssh?.localPort ?? 3080 },
  }
  if (mode === 'local' && raw.local.repoDir === '') { status('请填写仓库目录', false); return }
  if (mode === 'ssh' && raw.ssh.host === '') { status('请选择 SSH 主机', false); return }
  const save = $('save-settings'); if (save) save.disabled = true
  status('保存并重新连接…')
  const outcome = await api.save(raw)
  if (save) save.disabled = false
  if (!outcome.ok) status(outcome.error || '保存失败', false)
}

// ── boot ────────────────────────────────────────────────────────────────────

api.getState().then(state => {
  const s = state.settings
  savedSettings = s
  activeMode = s.mode === 'ssh' ? 'ssh' : 'local'
  deviceTerminal = state.terminal || (activeMode === 'ssh' ? 'SSH' : '本地')
  $('titlebar-terminal').textContent = `DSH-[${deviceTerminal}]`
  sshHostEntries = state.sshHosts
  const select = $('ssh-host'); const current = s.ssh?.host ?? ''; select.textContent = ''
  for (const entry of state.sshHosts) {
    const option = document.createElement('option'); option.value = entry.alias; option.textContent = `${entry.alias}（${entry.detail}）`
    if (entry.alias === current) option.selected = true; select.appendChild(option)
  }
  const custom = document.createElement('option'); custom.value = '__custom__'; custom.textContent = '自定义地址…'
  if (!state.sshHosts.some(entry => entry.alias === current)) custom.selected = true
  select.appendChild(custom)
  if (!state.sshHosts.some(entry => entry.alias === current)) $('ssh-custom').value = current
  for (const button of document.querySelectorAll('#mode-switch button')) button.classList.toggle('active', button.dataset.mode === s.mode)
  $('local-repo').value = s.local?.repoDir ?? ''; $('local-url').value = s.local?.repoUrl ?? ''
  $('local-home').value = s.local?.dshHome ?? '~/.dsh-dev'
  $('ssh-url').value = s.ssh?.remoteRepoUrl ?? ''; $('ssh-dir').value = s.ssh?.remoteRepoDir ?? '~/deepseek-harness'
  const update = s.update ?? {}
  updateState.autoCheckOnLaunch = update.autoCheckOnLaunch !== false
  setSwitch('auto-check', updateState.autoCheckOnLaunch)
  if (state.live && state.live.state === 'ready' && state.live.url) {
    const live = $('live-strip'); live.hidden = false; live.textContent = `当前连接：${state.live.url} — ${state.live.detail}`
  }
  refreshMode(); refreshSshHost(); refreshSections()
  if (activeSection === 'updates') void refreshUpdatesLog()
})

api.updates.getState().then(state => { updateState = state; renderUpdates() })
</script>
</body>
</html>
